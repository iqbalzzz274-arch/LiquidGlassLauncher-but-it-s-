name: Build VoidGlass Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Mencari ZIP project..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak dijumpai."
            exit 1
          fi

          echo "ZIP dijumpai: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Kandungan selepas extract:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle*" -o -name "build.gradle*" | \
            sed 's#/[^/]*$##' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project tidak dijumpai."
            echo "Semua fail:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Project dijumpai di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Mencari APK..."

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak dihasilkan."
            exit 1
          fi

          echo "APK dijumpai: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidGlassLauncher-APK
          path: ${{ env.APK_PATH }}
