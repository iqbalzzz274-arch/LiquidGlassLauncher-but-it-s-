name: Build Void Glass Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Project found in root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "./.git/*" \
          | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project tidak dijumpai."
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Building project..."
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidGlassLauncher-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
