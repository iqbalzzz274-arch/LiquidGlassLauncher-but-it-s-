name: Build Void Glass Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Void Glass project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \( \
            -name 'VoidGlassLauncherPremium_RedmiA3*.zip' -o \
            -name 'VoidGlassPremium_DeX_Lite_RedmiA3*.zip' -o \
            -name 'VoidGlassLauncher*.zip' \
          \) -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak dijumpai."
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          ROOT="$(find project -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [ -n "$ROOT" ]; then
            shopt -s dotglob
            cp -a "$ROOT"/. project/
            rm -rf "$ROOT"
          fi

          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidGlassLauncher-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
